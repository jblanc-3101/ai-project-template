services:
  api:
    build: .
    # Both services publish their port on 127.0.0.1 on purpose: MLflow has no authentication.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: json
      MLFLOW_TRACKING_URI: http://mlflow:5000
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      # Keep --port=5000 and do not give .env to this service: mlflow server reads MLFLOW_PORT
      # as its listening port.
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s

volumes:
  mlflow-data:
